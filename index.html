<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FSP-Notizen</title>
  <meta name="description" content="Einfache Übersicht für FSP-Notizen." />
  <style>
    :root{
      --bg:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --soft:#f9fafb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 16px 56px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 24px;
    }

    h1, h2 {
      margin: 0;
      line-height: 1.2;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .note-link {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .note-link:hover {
      border-color: #cbd5e1;
      background: #fff;
    }

    .note-link small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-weight: 400;
    }

    .footer {
      margin-top: 18px;
      font-size: .95rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body { font-size: 17px; }
      .wrap { padding: 20px 12px 36px; }
      .box { padding: 18px; border-radius: 14px; }
      h1 { font-size: 1.7rem; }
      .note-link { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="box">
      <h1>FSP-Notizen</h1>
      <p>Einfache Sammlung von Lernnotizen für die Fachsprachprüfung.</p>

      <div class="section">
        <h2>Themen</h2>
      </div>

      <div class="section">
        <a class="note-link" href="./docs/bph.html">
          BPH – Benigne Prostatahyperplasie
          <small>Erklärung, Zusammenfassung, Anamnese, Differenzialdiagnosen, beruhigende Sätze</small>
        </a>
      </div>

      <p class="footer">Weitere Themen können später ergänzt werden.</p>
    </section>
  </main>
</body>
</html>
